<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가위바위보 룰렛</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5ed;
      color: #172331;
      font-family: system-ui, -apple-system, "Malgun Gothic", "맑은 고딕", sans-serif;
      text-align: center;
    }
    main { width: min(100%, 680px); padding: 24px 16px 40px; }
    h1 { margin: 0 0 14px; font-size: clamp(2.1rem, 6vw, 3.25rem); }
    .result {
      min-height: 1.5em;
      margin: 0 0 20px;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 900;
      line-height: 1.5;
      color: #123a65;
    }
    .wheel-area {
      position: relative;
      width: min(86vw, 460px);
      margin: 0 auto 34px;
      padding-top: 22px;
    }
    .pointer {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 21px solid transparent;
      border-right: 21px solid transparent;
      border-top: 37px solid #172331;
      filter: drop-shadow(0 2px 2px #0005);
    }
    .wheel {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 8px solid #172331;
      border-radius: 50%;
      background: conic-gradient(from -60deg,
        #bd302e 0deg 120deg,
        #245a99 120deg 240deg,
        #26714e 240deg 360deg);
      box-shadow: 0 10px 24px #0003;
      transform: rotate(0deg);
      will-change: transform;
    }
    .dividers { position: absolute; inset: 0; width: 100%; height: 100%; }
    .label {
      position: absolute;
      color: white;
      font-size: clamp(2.3rem, 9vw, 4rem);
      font-weight: 900;
      line-height: 1;
      transform: translate(-50%, -50%);
      text-shadow: 0 2px 3px #0006;
      white-space: nowrap;
    }
    .scissors { left: 50%; top: 18%; }
    .rock { left: 78%; top: 67%; }
    .paper { left: 22%; top: 67%; }
    .hub {
      position: absolute;
      left: 50%; top: 50%;
      width: 11%; aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 5px solid #172331;
      border-radius: 50%;
      background: white;
    }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    button {
      min-height: 74px;
      min-width: 180px;
      padding: 12px 24px;
      border: 3px solid #172331;
      border-radius: 16px;
      background: #f4c341;
      color: #172331;
      font-family: inherit;
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.secondary { background: white; }
    button:hover:not(:disabled) { filter: brightness(.94); }
    button:focus-visible { outline: 5px solid #1e6bc7; outline-offset: 4px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    @media (max-width: 400px) {
      .buttons { display: grid; }
      button { width: min(86vw, 300px); }
    }
  </style>
</head>
<body>
  <main>
    <h1>가위바위보 룰렛</h1>
    <p id="result" class="result" role="status" aria-live="polite">돌리기를 눌러 주세요</p>

    <div class="wheel-area">
      <div class="pointer" aria-hidden="true"></div>
      <div id="wheel" class="wheel" role="img" aria-label="가위, 바위, 보가 같은 크기로 나뉜 룰렛">
        <svg class="dividers" viewBox="0 0 400 400" aria-hidden="true">
          <path d="M200 200 L26.795 100 M200 200 L373.205 100 M200 200 L200 400"
                fill="none" stroke="white" stroke-width="6"/>
        </svg>
        <span class="label scissors">가위</span>
        <span class="label rock">바위</span>
        <span class="label paper">보</span>
        <span class="hub" aria-hidden="true"></span>
      </div>
    </div>

    <div class="buttons">
      <button id="spin" type="button">돌리기</button>
      <button id="again" class="secondary" type="button" disabled>다시 돌리기</button>
    </div>
  </main>
  <script>
    const wheel = document.getElementById('wheel');
    const result = document.getElementById('result');
    const spinButton = document.getElementById('spin');
    const againButton = document.getElementById('again');
    const choices = ['가위', '바위', '보'];
    let rotation = 0;
    let spinning = false;

    function spin() {
      if (spinning) return;
      spinning = true;
      spinButton.disabled = true;
      againButton.disabled = true;
      result.textContent = '돌아가는 중…';

      const selected = Math.floor(Math.random() * choices.length);
      // 각 칸의 중심은 시작 위치에서 시계 방향으로 0°, 120°, 240°다.
      const centerAtPointer = (360 - selected * 120) % 360;
      const offset = Math.random() * 80 - 40; // 경계에서 최소 20° 떨어져 멈춘다.
      const desired = ((centerAtPointer + offset) % 360 + 360) % 360;
      const current = ((rotation % 360) + 360) % 360;
      const adjustment = (desired - current + 360) % 360;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const duration = reducedMotion ? 0 : 4600;

      rotation += (reducedMotion ? 0 : 6 * 360) + adjustment;
      wheel.style.transition = `transform ${duration}ms cubic-bezier(.12, .68, .12, 1)`;
      wheel.style.transform = `rotate(${rotation}deg)`;

      window.setTimeout(() => {
        result.textContent = `결과: ${choices[selected]}!`;
        spinButton.disabled = false;
        againButton.disabled = false;
        spinning = false;
      }, duration + 50);
    }

    spinButton.addEventListener('click', spin);
    againButton.addEventListener('click', spin);
  </script>
</body>
</html>
